<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYSHIELD AI | Login</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101e32;--line:#263b55;--cyan:#42d9ff;--muted:#9db1ca;--text:#eff7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#132b47 0%,#07111f 60%);font:15px Arial,sans-serif;color:var(--text)}
.card{width:min(420px,100%);padding:34px;background:rgba(16,30,50,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px #0006}
.logo{text-align:center;font-weight:800;letter-spacing:2px;font-size:25px}.logo span{color:var(--cyan)}.sub{text-align:center;color:var(--muted);font-size:12px;line-height:1.6;margin:10px 0 28px}
h2{font-size:20px;margin:0 0 7px}.hint{font-size:13px;color:var(--muted);margin:0 0 22px}
label{display:block;font-size:13px;margin:16px 0 8px}input{width:100%;padding:13px 12px;border-radius:8px;border:1px solid #344c69;background:#091525;color:var(--text);outline:none}input:focus{border-color:var(--cyan)}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:var(--cyan);color:#06111d;font-weight:bold;font-size:15px;cursor:pointer}button:hover{filter:brightness(1.08)}
.message{padding:11px;border-radius:8px;margin:12px 0;font-size:13px}.error{background:#4a202a;color:#ffd9de}.logout{background:#173b32;color:#b8ffe5}
.footer{text-align:center;color:#8197b3;font-size:11px;line-height:1.6;margin-top:24px}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><span>SKYSHIELD</span> AI</div>
  <div class="sub">COUNTER-DRONE DETECTION &amp; THREAT MANAGEMENT<br>SECURE DASHBOARD ACCESS</div>
  <h2>Welcome back</h2>
  <p class="hint">Sign in to open the tracking dashboard.</p>
  <div id="message" aria-live="polite"></div>
  <form action="/login" method="post">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in securely</button>
  </form>
  <div class="footer">Academic project · Tracking data may include aircraft ADS-B and is not dedicated drone Remote ID.</div>
</main>
<script>
const p = new URLSearchParams(location.search);
const box = document.getElementById('message');
if (p.has('error')) { box.className='message error'; box.textContent='Login failed. Check your username and password.'; }
else if (p.has('logout')) { box.className='message logout'; box.textContent='You have been signed out.'; }
</script>
</body>
</html>
